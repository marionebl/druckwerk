name: Externals
# The plugin download and the certificate URL must still work, and the plugin must match its pinned hash.
# Weekly, because a removed vendor version shows only at a new install otherwise.
on:
  schedule:
    - cron: '17 5 * * 1'
  pull_request:
    paths: [hub/externals.py, hub/externals.env, tools/check-externals.sh, .github/workflows/externals.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/check-externals.sh
