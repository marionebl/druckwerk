name: ffmpeg debug
on:
  push:
    branches: [slim-image]
jobs:
  ff:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: |
          git clone -q --depth 1 --branch n7.1.1 https://github.com/FFmpeg/FFmpeg /src && cd /src
          grep -n "aom_film_grain\|h2645_sei\|h264_sei" libavcodec/Makefile
          grep -n "aom_film_grain\|h2645_sei" configure | head
