name: Size probe
on:
  push:
    branches: [size-probe]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: aarch64, runner: ubuntu-24.04-arm}
          - {arch: amd64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Orca vs Bambu Studio flatpaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak >/dev/null
          sudo flatpak remote-add --system --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          echo "=== search orca"; sudo flatpak search --system orca 2>&1 | head -8
          echo "=== orca release assets"; gh api "repos/SoftFever/OrcaSlicer/releases?per_page=6" --jq '.[] | "\(.tag_name) pre=\(.prerelease) \(.published_at[0:10])", (.assets[] | select(.name|test("arm|aarch|linux";"i")) | "    \(.name) \((.size/1e6|floor)) MB")' 2>&1 | head -30
          for id in com.orcaslicer.OrcaSlicer com.bambulab.BambuStudio; do
            echo "=== remote-info $id"; sudo flatpak remote-info --system flathub $id | head -14
          done
          for id in com.orcaslicer.OrcaSlicer com.bambulab.BambuStudio; do
            sudo flatpak install --system -y --noninteractive flathub $id >/dev/null 2>&1 || echo "install failed $id"
          done
          for id in com.orcaslicer.OrcaSlicer com.bambulab.BambuStudio; do
            echo "=== $id"; A=$(sudo flatpak info --system --show-location $id)/files
            RT=$(sudo flatpak info --system --show-runtime $id); R=$(sudo flatpak info --system --show-location $RT)/files
            echo "runtime=$RT"; sudo du -sm "$A" "$R" | sed 's|^|MB |'
            echo "-- app depth1 (MB)"; sudo du -m -d1 "$A" | sort -rn | head -6
            echo "-- app/bin"; sudo ls -l "$A/bin" | head
            echo "-- BBL.json"; F=$(sudo find "$A" -name BBL.json -path "*profiles*" | head -1); echo "$F"; sudo grep -m3 -E '"(name|version)"' "$F"
            echo "-- machine files H2S / P1S"; sudo find "$A" -path "*profiles/BBL/machine/*" \( -name "*H2S*" -o -name "*P1S*" \) | sed 's|.*/BBL/||' | head -12
            echo "-- BBL dir size (MB)"; sudo du -sm "$(dirname "$F")/BBL"
          done
