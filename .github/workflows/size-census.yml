name: Size census
on:
  push:
    branches: [slim-image]
jobs:
  census:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -q -f hub/Dockerfile --build-arg VERSION=census --build-arg HASS_ARCH=aarch64 -t census . >/dev/null
      - name: Census
        run: |
          docker run --rm --entrypoint bash census -c '
            cd /opt/bs
            echo == BambuStudio share; du -k --max-depth=2 app/share/BambuStudio | sort -rn | head -30
            echo == app/lib biggest; find app/lib -type f -printf "%s %p\n" | sort -rn | head -45
            echo == runtime/lib biggest; find runtime/lib -type f -printf "%s %p\n" | sort -rn | head -50
            echo == app/bin; ls -lS app/bin | head; ls -l bin
            REAL=$(ls app/bin | grep -i bambu | head -1); echo real=$REAL
            LP="app/lib:runtime/lib/aarch64-linux-gnu:runtime/lib"
            echo == ldd closure; LD_LIBRARY_PATH=$LP runtime/lib/ld-linux-aarch64.so.1 --list app/bin/$REAL 2>&1 | awk "{print \$3}" | grep "^/\|^[a-z]" | sort -u > /tmp/closure.txt; wc -l /tmp/closure.txt
            cat /tmp/closure.txt | xargs -r -I{} sh -c "readlink -f {} 2>/dev/null" | sort -u | xargs -r du -ck | tail -1
            echo == slice size; du -sk app runtime
          ' 2>&1 | head -230
