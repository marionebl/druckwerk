name: webkit-probe
on:
  push:
    branches: [wasm-only-ui]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          uname -m
          python3 -m venv /tmp/v
          /tmp/v/bin/pip install -q playwright pytest
          /tmp/v/bin/python -m playwright install --with-deps webkit
          /tmp/v/bin/python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); b=p.webkit.launch(); print('WebKit', b.version); b.close()"
      - name: old code (origin/main ui, no promotion)
        run: |
          git worktree add /tmp/old origin/main
          cd hub/tests && UI_DIR=/tmp/old/hub/ui /tmp/v/bin/python webkit_isolation.py || echo "old code exit $?"
      - name: new code
        run: cd hub/tests && /tmp/v/bin/python webkit_isolation.py
      - name: test_ui_static
        run: /tmp/v/bin/pip install -q -r hub/requirements.txt 2>/dev/null || true; /tmp/v/bin/python -m pytest hub/tests/test_ui_static.py -q
