name: Druckwerk
version: "3.30.0"
slug: druckwerk
# Built and pushed by .github/workflows/hub.yml on main; HA pulls <image>:<version>.
image: ghcr.io/marionebl/druckwerk-{arch}
description: Cloud print bridge, browser slicing and print queue for 3D printers in one app, through Home Assistant ingress
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
discovery: [druckwerk]
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d
panel_title: Druckwerk
homeassistant_api: true
hassio_api: true
map: ["share:rw", "media:rw"]
panel_admin: false
watchdog: http://[HOST]:8098/api/health
options:
  plates_repo: marionebl/druckwerk-plates
schema:
  plates_repo: str
  plates_token: password?
