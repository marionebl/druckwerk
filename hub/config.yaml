name: Druckwerk
version: "3.3.0"
slug: druckwerk
# Built and pushed by .github/workflows/hub.yml on main; HA pulls <image>:<version>.
image: ghcr.io/marionebl/druckwerk-{arch}
description: Cloud print bridge, browser slicing and print queue for 3D printers in one app, through Home Assistant ingress
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
discovery: [druckwerk]
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d
panel_title: Druckwerk
homeassistant_api: true
hassio_api: true
map: ["share:rw", "media:rw"]
panel_admin: false
# Plates pushed to a private GitHub repo by an agent: druckwerk.add_to_queue with file_url fetches them. Both keys may be
# missing (older options.json): the app then uses the default repo and refuses file_url until a token is set.
options:
  plates_repo: marionebl/druckwerk-plates
  plates_token: ""
schema:
  plates_repo: str?
  plates_token: password?
