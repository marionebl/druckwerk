print_file:
  fields:
    device_id:
      selector:
        device:
          filter:
            - manufacturer: Bambu Lab
    serial:
      example: "0000TEST0000001"
      selector:
        text:
    file:
      required: true
      example: "benchy.gcode.3mf"
      selector:
        text:
    timelapse:
      default: false
      selector:
        boolean:
    bed_leveling:
      default: "on"
      selector:
        select:
          options: ["on", "off", "auto"]
    use_ams:
      default: true
      selector:
        boolean:
    flow_cali:
      advanced: true
      selector:
        select:
          options: ["on", "off", "auto"]
    vibration_cali:
      advanced: true
      selector:
        boolean:
    layer_inspect:
      advanced: true
      selector:
        boolean:
    nozzle_offset_cali:
      advanced: true
      selector:
        select:
          options: ["off", "on", "auto"]
    bed_type:
      advanced: true
      selector:
        select:
          options: ["auto", "cool_plate", "eng_plate", "hot_plate", "textured_plate", "supertack_plate", "3d_effect_plate"]
    ext_change_assist:
      advanced: true
      selector:
        boolean:
    force:
      default: false
      selector:
        boolean:
