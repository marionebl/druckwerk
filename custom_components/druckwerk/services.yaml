print_file:
  fields:
    device_id:
      selector:
        device:
          filter:
            - manufacturer: Bambu Lab
    serial:
      example: "0000TEST0000001"
      selector:
        text:
    file:
      required: true
      example: "benchy.gcode.3mf"
      selector:
        text:
    timelapse:
      default: false
      selector:
        boolean:
    bed_leveling:
      default: "on"
      selector:
        select:
          options: ["on", "off", "auto"]
    use_ams:
      default: true
      selector:
        boolean:
    flow_cali:
      advanced: true
      selector:
        select:
          options: ["on", "off", "auto"]
    vibration_cali:
      advanced: true
      selector:
        boolean:
    layer_inspect:
      advanced: true
      selector:
        boolean:
    nozzle_offset_cali:
      advanced: true
      selector:
        select:
          options: ["off", "on", "auto"]
    bed_type:
      advanced: true
      selector:
        select:
          options: ["auto", "cool_plate", "eng_plate", "hot_plate", "textured_plate", "supertack_plate", "3d_effect_plate"]
    ext_change_assist:
      advanced: true
      selector:
        boolean:
    force:
      default: false
      selector:
        boolean:

get_printers:
  fields:
    printer:
      example: "Lab H2S"
      selector:
        text: {}

get_queue:
  fields:
    history_limit:
      default: 0
      selector:
        number:
          min: 0
          max: 50
          mode: "box"

add_to_queue:
  fields:
    file:
      example: "benchy_better_h2s.gcode.3mf"
      selector:
        text: {}
    slice_job_id:
      example: "a1b2c3d4e5f6"
      selector:
        text: {}
    target:
      default: "any"
      selector:
        text: {}
    model:
      example: "H2S"
      selector:
        text: {}
    options:
      example:
        timelapse: true
        bed_leveling: auto
        bed_type: textured_plate
      selector:
        object: {}
    name:
      example: "Benchy for Anna"
      selector:
        text: {}

slice:
  fields:
    model_file:
      required: true
      example: "/media/models/cube.stl"
      selector:
        text: {}
    printer:
      selector:
        text: {}
      required: true
    tray:
      required: true
      example: "0:0"
      selector:
        text: {}
    plate:
      example: "Textured PEI Plate"
      selector:
        select:
          options: ["Cool Plate", "Engineering Plate", "High Temp Plate", "Textured PEI Plate", "Supertack Plate"]
    wait:
      default: true
      selector:
        boolean: {}

get_slice:
  fields:
    slice_job_ids:
      required: true
      example: ["a1b2c3d4e5f6"]
      selector:
        text:
          multiple: true

cancel_job:
  fields:
    job_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text: {}

reorder_job:
  fields:
    job_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text: {}
    position:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 500
          mode: "box"
    printer:
      selector:
        text: {}

move_job:
  fields:
    job_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text: {}
    target:
      required: true
      example: "any"
      selector:
        text: {}
    model:
      selector:
        text: {}

skip_job:
  fields:
    job_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text: {}

approve_job:
  fields:
    job_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text: {}

reject_job:
  fields:
    job_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text: {}

retry_job:
  fields:
    job_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text: {}

start_next:
  fields:
    printer:
      selector:
        text: {}
      required: true
    plate_clear:
      default: false
      selector:
        boolean: {}
    confirmed_by_person:
      default: false
      selector:
        boolean: {}

start_job:
  fields:
    printer:
      selector:
        text: {}
      required: true
    job_id:
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text: {}
    plate_clear:
      default: false
      selector:
        boolean: {}
    confirmed_by_person:
      default: false
      selector:
        boolean: {}

camera_snapshot:
  fields:
    printer:
      selector:
        text: {}
      required: true
